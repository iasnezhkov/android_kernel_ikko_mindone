name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: No references to trees outside this repository
        run: python3 -B mindone/modules/tools/scripts/extpathcheck.py

      - name: Source hygiene (paths, language, stray files)
        run: python3 -B mindone/modules/tools/scripts/tree-lint.py --fail

      - name: No binaries committed
        run: |
          set -eu
          found=0
          while IFS= read -r f; do
            case "$(file -b "$f")" in
              *ELF*|*"ar archive"*)
                echo "binary committed: $f"; found=1 ;;
            esac
          done < <(git ls-files mindone)
          [ "$found" = "0" ] || { echo "binaries must not be committed"; exit 1; }

      - name: Every docs/ reference resolves to a file that is here
        run: python3 -B mindone/modules/tools/scripts/docpathcheck.py

      - name: Documentation reference regression
        run: python3 -B mindone/tests/docpath-check.py

      - name: Module inventory matches BUILD.bazel and load lists
        run: python3 -B mindone/tests/modules-tsv-check.py .

      - name: Validate GKI base pin metadata
        run: |
          python3 -B - <<'PY'
          import json
          import re
          from pathlib import Path

          pin = json.loads(Path("mindone/gki-base.json").read_text(encoding="utf-8"))
          assert re.fullmatch(r"android[0-9]+-[0-9]+\.[0-9]+-[0-9]{4}-[0-9]{2}_r[0-9]+", pin["ack_tag"])
          assert re.fullmatch(r"[0-9a-f]{40}", pin["ack_commit"])
          assert re.fullmatch(r"[0-9]+", str(pin["gki_build_id"]))
          assert pin["gki_target"] == "kernel_aarch64"
          print(f"PASS mindone/gki-base.json: {pin['ack_tag']} ci-{pin['gki_build_id']}")
          PY

      - name: Python tools and test scripts parse
        run: |
          set -eu
          for f in mindone/modules/tools/scripts/*.py mindone/tests/*.py; do
            python3 -B -m py_compile "$f"
          done

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ensure clang is available
        run: |
          set -eu
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -yq clang
          fi
          clang --version | head -n 1

      - name: Run kernel host test suite
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -sf "$(command -v clang)" "$RUNNER_TEMP/clang-bin/cc"
          ln -sf "$(command -v clang)" "$RUNNER_TEMP/clang-bin/clang"
          python3 -B mindone/tests/run-checks.py --tree . --compiler-dir "$RUNNER_TEMP/clang-bin" --jobs 4 --allow "pinctrl-mt6789=requires pre-migration fork git revision absent in squashed public snapshots"
