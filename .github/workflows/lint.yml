name: tree hygiene

# The tree has rules that are easy to state and easy to break by accident: no absolute paths
# from anyone's machine, no references to other source trees, English only in code, no binaries.
# A person cannot hold that in their head across 5 000 files, so it runs here on every push.
#
# This deliberately does NOT build the kernel. A kernel build needs a pinned clang and tens of
# minutes; what breaks in practice is hygiene, and catching that in seconds is worth more than a
# build that nobody waits for.

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No references to trees outside this repository
        run: python3 mindone/modules/tools/scripts/extpathcheck.py

      - name: Source hygiene (paths, language, stray files)
        run: python3 mindone/modules/tools/scripts/tree-lint.py --fail

      - name: No binaries committed
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            case "$(file -b "$f")" in
              *ELF*|*"ar archive"*)
                echo "binary committed: $f"; found=1 ;;
            esac
          done < <(git ls-files mindone)
          [ "$found" = "0" ] || { echo "binaries must not be committed"; exit 1; }

      - name: Every docs/ reference resolves to a file that is here
        run: python3 mindone/modules/tools/scripts/docpathcheck.py

      - name: Documentation reference regression
        run: python3 mindone/tests/docpath-check.py

      - name: Python tools parse
        run: |
          for f in mindone/modules/tools/scripts/*.py; do
            python3 -m py_compile "$f"
          done
